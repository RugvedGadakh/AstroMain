<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF7A00" />
    <title>AstroVision – Vedic Astrology & Spiritual Healing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              saffron: '#FF7A00',
              gold: '#FFC107',
              maroon: '#5D4037',
              cream: '#FFF8F0',
              ember: '#FF4500',
            },
            fontFamily: {
              cinzel: ['Cinzel', 'serif'],
              lato: ['Lato', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.7s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 20px rgba(255,122,0,0.3)' },
                '50%': { boxShadow: '0 0 60px rgba(255,122,0,0.7)' },
              },
              fadeIn: {
                from: { opacity: '0' },
                to: { opacity: '1' },
              },
              slideUp: {
                from: { opacity: '0', transform: 'translateY(40px)' },
                to: { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        scroll-behavior: smooth;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Lato', sans-serif; background: #0a0404; }
      .grain-overlay::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
        opacity: 0.4;
      }
      .glow-text { text-shadow: 0 0 40px rgba(255,193,7,0.5), 0 0 80px rgba(255,122,0,0.3); }
      .card-glow:hover { box-shadow: 0 0 30px rgba(255,122,0,0.25), 0 20px 60px rgba(0,0,0,0.4); }
      .nav-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
      .hero-bg { background: radial-gradient(ellipse at 50% 0%, rgba(255,122,0,0.15) 0%, transparent 70%), radial-gradient(ellipse at 80% 50%, rgba(255,193,7,0.08) 0%, transparent 50%), #0a0404; }
      .section-divider { background: linear-gradient(90deg, transparent, rgba(255,122,0,0.6), transparent); height: 1px; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0404; }
      ::-webkit-scrollbar-thumb { background: #FF7A00; border-radius: 3px; }
      input, select, textarea { outline: none; }
      input:focus, select:focus, textarea:focus { border-color: #FF7A00 !important; box-shadow: 0 0 0 2px rgba(255,122,0,0.2); }
    </style>
  </head>
  <body class="grain-overlay">
    <div id="root"></div>
  </body>
</html>
