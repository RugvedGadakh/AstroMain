<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF7A00" />
    <title>AstroVision – Vedic Astrology & Spiritual Healing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              saffron: '#F16F45', // Soothing Terracotta-Saffron Sunrise Orange
              gold: '#F2AF42',    // Soothing Sunlit Honey Gold
              dawn: '#FAF6F0',    // Soothing Linen Off-White Background
              dusk: '#F3ECE3',    // Soothing Warm Beige Secondary Background
              cream: '#FFFFFF',   // Pristine White for Card Containers
              slate: '#352F2D',   // Deep Cocoa-Charcoal for Soothing Text Contrast
              maroon: '#5D4037',
              ember: '#FF4500',
            },
            fontFamily: {
              cinzel: ['Cormorant Garamond', 'serif'],
              lato: ['Plus Jakarta Sans', 'sans-serif'],
              playfair: ['Cormorant Garamond', 'serif'],
              cormorant: ['Cormorant Garamond', 'serif'],
              jakarta: ['Plus Jakarta Sans', 'sans-serif'],
              realcinzel: ['Cinzel', 'serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.7s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 20px rgba(241,111,69,0.1)' },
                '50%': { boxShadow: '0 0 60px rgba(241,111,69,0.25)' },
              },
              fadeIn: {
                from: { opacity: '0' },
                to: { opacity: '1' },
              },
              slideUp: {
                from: { opacity: '0', transform: 'translateY(40px)' },
                to: { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        scroll-behavior: smooth;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #FAF6F0; color: #352F2D; }
      .grain-overlay::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
        opacity: 0.25;
      }
      .glow-text { text-shadow: 0 1px 2px rgba(241,111,69,0.1); }
      .card-glow:hover { box-shadow: 0 12px 30px rgba(53,47,45,0.06), 0 2px 8px rgba(241,111,69,0.04); }
      .nav-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
      .hero-bg { background: radial-gradient(ellipse at 50% 0%, rgba(241,111,69,0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(242,175,66,0.03) 0%, transparent 50%), #FAF6F0; }
      .section-divider { background: linear-gradient(90deg, transparent, rgba(241,111,69,0.12), transparent); height: 1px; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #FAF6F0; }
      ::-webkit-scrollbar-thumb { background: #F16F45; border-radius: 3px; }
      input, select, textarea { outline: none; }
      input:focus, select:focus, textarea:focus { border-color: #F16F45 !important; box-shadow: 0 0 0 2px rgba(241,111,69,0.12); }
    </style>
  </head>
  <body class="grain-overlay">
    <div id="root"></div>
  </body>
</html>
